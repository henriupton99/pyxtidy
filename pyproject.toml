[project]
name = "pyxtidy"
version = "0.2.0"
description = "Utilitaire pour tri de fichiers media (photos, videos)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow>=11.3.0",
    "pillow-heif>=1.1.0",
]

[project.scripts]
pyxtidy = "pyxtidy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyxtidy"]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]
