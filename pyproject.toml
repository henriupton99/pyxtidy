[project]
name = "pyxtidy"
version = "0.1.0"
description = "Utilitaire pour tri de fichiers media (photos, videos)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.2",
    "piexif>=1.1.3",
    "pillow>=11.3.0",
    "pillow-heif>=1.1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]
